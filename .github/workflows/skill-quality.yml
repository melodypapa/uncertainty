name: Skill Quality Check

on:
  push:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - '.github/workflows/skill-quality.yml'
  pull_request:
    branches: [main]
    paths:
      - 'skills/**/SKILL.md'
      - '.github/workflows/skill-quality.yml'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

jobs:
  skills-check:
    name: Skills Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # voodootikigod/skills-check@v1 internally pins skills-check@1.3.0, which
      # npm has unpublished (latest published: 1.2.1) and which enables the
      # auth-gated skills.sh registry audits by default - failing weekly with
      # an opaque HIGH finding since 2026-06-08. Run the published CLI
      # directly so results are reproducible locally. See #92.
      - name: Audit skill security
        run: npx --yes skills-check@1.2.1 audit . --fail-on high

      - name: Lint skill metadata
        run: npx --yes skills-check@1.2.1 lint . --fail-on error

      - name: Analyze token budget
        run: npx --yes skills-check@1.2.1 budget . --max-tokens 50000

      - name: Generate Report
        if: always()
        run: |
          echo "## Skills Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All skills validated for freshness, security, quality, and efficiency." >> $GITHUB_STEP_SUMMARY

  secrets-scan:
    name: Secrets Detection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan for secrets
        run: |
          echo "Scanning for potential secrets in skill files..."
          find skills -name "SKILL.md" -exec grep -l -E '(API_KEY|SECRET|PASSWORD|TOKEN|PRIVATE_KEY)=[^[:space:]]' {} \; 2>/dev/null || echo "No hardcoded secrets found"

      - name: Scan for shell injection patterns
        run: |
          echo "Scanning for shell injection patterns..."
          find skills -name "SKILL.md" -exec grep -l -E '\$\([^)]*\)|`[^`]*\$\{' {} \; 2>/dev/null || echo "No shell injection patterns found"

      - name: Scan for unsafe exec patterns
        run: |
          echo "Scanning for unsafe exec patterns..."
          find skills -name "SKILL.md" -exec grep -l -E '(exec\(|eval\(|os\.system|subprocess\.(shell|call))' {} \; 2>/dev/null || echo "No unsafe exec patterns found"

  summary:
    name: Quality Summary
    runs-on: ubuntu-latest
    needs: [skills-check, secrets-scan]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## Skill Quality Check Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Skills Check | ${{ needs.skills-check.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Secrets Scan | ${{ needs.secrets-scan.result }} |" >> $GITHUB_STEP_SUMMARY
